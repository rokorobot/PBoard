<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PBoard · Cloudroom</title>
<style>
  :root {
    color-scheme: light;
    --bg: #f4f4f1; --card: #fcfcfb; --ink: #0b0b0b; --ink2: #52514e; --muted: #8a8983;
    --line: rgba(11,11,11,.10); --grid: #e1e0d9; --accent: #2a78d6;
    --good: #0ca30c; --warn: #fab219; --crit: #d03b3b; --idle: #a8a79f;
  }
  @media (prefers-color-scheme: dark) {
    :root:where(:not([data-theme="light"])) {
      color-scheme: dark;
      --bg: #111110; --card: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8a8983;
      --line: rgba(255,255,255,.10); --grid: #2c2c2a; --accent: #3987e5; --idle: #5c5b57;
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #111110; --card: #1a1a19; --ink: #f0efec; --ink2: #c3c2b7; --muted: #8a8983;
    --line: rgba(255,255,255,.10); --grid: #2c2c2a; --accent: #3987e5; --idle: #5c5b57;
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink);
    font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  header { display: flex; gap: 12px; align-items: center; flex-wrap: wrap;
    padding: 16px 24px; border-bottom: 1px solid var(--line); position: sticky; top: 0;
    background: var(--bg); z-index: 2; }
  h1 { font-size: 18px; margin: 0 12px 0 0; letter-spacing: -.01em; }
  h1 span { color: var(--muted); font-weight: 400; }
  .kpis { display: flex; gap: 20px; margin-right: auto; }
  .kpi b { font-size: 18px; display: block; line-height: 1.1; font-variant-numeric: tabular-nums; }
  .kpi small { color: var(--ink2); font-size: 12px; }
  input, button { font: inherit; color: var(--ink); background: var(--card);
    border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; }
  button { cursor: pointer; } button:hover { border-color: var(--accent); }
  #meta { color: var(--muted); font-size: 12px; }
  main { padding: 20px 24px 40px; display: grid; gap: 16px;
    grid-template-columns: repeat(auto-fill, minmax(360px, 1fr)); }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
  .top { display: flex; gap: 12px; align-items: flex-start; }
  .rank { color: var(--muted); font-variant-numeric: tabular-nums; width: 20px; }
  .name { font-weight: 600; font-size: 15px; overflow-wrap: anywhere; }
  .root { color: var(--muted); font-size: 12px; font-family: ui-monospace, Consolas, monospace;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .grow { flex: 1; min-width: 0; }
  .stats { display: flex; gap: 14px; font-size: 12px; color: var(--ink2); flex-wrap: wrap; }
  .stats b { color: var(--ink); font-variant-numeric: tabular-nums; }
  .spark { display: block; }
  .spark rect { fill: var(--accent); }
  .spark rect.zero { fill: var(--grid); }
  .spark .hit { fill: transparent; }
  .threads { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
  .threads li { display: grid; grid-template-columns: 14px 1fr auto; gap: 8px; align-items: center;
    padding: 7px 0; border-bottom: 1px solid var(--line); }
  .threads li:last-child { border-bottom: 0; }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--idle); }
  .dot.s-active, .dot.s-starting, .dot.s-pending, .dot.s-stopping { background: var(--good); box-shadow: 0 0 0 3px color-mix(in srgb, var(--good) 25%, transparent); }
  .dot.s-error { background: var(--crit); }
  .dot.s-waiting { background: var(--warn); }
  .t-title { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-sub { color: var(--muted); font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .t-right { text-align: right; font-size: 12px; color: var(--ink2); white-space: nowrap; }
  .copy { border: 0; background: none; padding: 0 0 0 6px; color: var(--muted); font-size: 12px; }
  .copy:hover { color: var(--accent); }
  .badge { font-size: 11px; padding: 1px 6px; border-radius: 99px; border: 1px solid var(--line); color: var(--ink2); }
  .badge.err { color: var(--crit); border-color: color-mix(in srgb, var(--crit) 40%, transparent); }
  .empty, .error { grid-column: 1 / -1; padding: 40px; text-align: center; color: var(--ink2);
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; }
  .error code { display: block; margin-top: 10px; color: var(--crit); white-space: pre-wrap; text-align: left; }
  #tip { position: fixed; pointer-events: none; background: var(--ink); color: var(--bg);
    padding: 4px 8px; border-radius: 6px; font-size: 12px; display: none; z-index: 9; }
</style>
</head>
<body>
<header>
  <h1>PBoard <span>· Cloudroom</span></h1>
  <div class="kpis" id="kpis"></div>
  <input id="q" type="search" placeholder="Filter projects or threads…" aria-label="Filter">
  <button id="refresh" title="Refresh now (R)">↻ Refresh</button>
  <button id="theme" title="Toggle light/dark">Theme</button>
  <span id="meta"></span>
</header>
<main id="grid"><div class="empty">Loading…</div></main>
<div id="tip"></div>
<script>
const $ = (s) => document.querySelector(s);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let data = null;

function ago(ms) {
  if (!ms) return '—';
  const s = (Date.now() - ms) / 1000;
  if (s < 60) return 'just now';
  if (s < 3600) return Math.floor(s / 60) + 'm ago';
  if (s < 86400) return Math.floor(s / 3600) + 'h ago';
  return Math.floor(s / 86400) + 'd ago';
}

function spark(vals) {
  const w = 14 * 10, h = 28, max = Math.max(1, ...vals);
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img"
    aria-label="Threads active per day, last 14 days: ${vals.join(', ')}">` +
    vals.map((v, i) => {
      const bh = v ? Math.max(3, (v / max) * h) : 2;
      const day = 13 - i;
      const label = `${v} thread${v === 1 ? '' : 's'} · ${day === 0 ? 'today' : day + 'd ago'}`;
      return `<rect class="${v ? '' : 'zero'}" x="${i * 10 + 1}" y="${h - bh}" width="8" height="${bh}" rx="2"/>` +
        `<rect class="hit" data-tip="${label}" x="${i * 10}" y="0" width="10" height="${h}"/>`;
    }).join('') + '</svg>';
}

function threadRow(t) {
  const dotCls = t.status === 'error' || t.queuedWork === 'failed' ? 'error'
    : t.queuedWork === 'waiting' && t.status === 'idle' ? 'waiting' : t.status;
  const sub = [t.status, t.provider, t.model, t.machine].filter(Boolean).join(' · ');
  return `<li>
    <span class="dot s-${esc(dotCls)}" title="${esc(t.status)}${t.queuedWork !== 'none' ? ' · queued: ' + esc(t.queuedWork) : ''}"></span>
    <div style="min-width:0"><div class="t-title">${t.pinned ? '📌 ' : ''}${esc(t.title)}</div><div class="t-sub">${esc(sub)}</div></div>
    <div class="t-right">${ago(t.activity)}<button class="copy" data-copy="${esc(t.id)}" title="Copy thread ID">⧉</button></div>
  </li>`;
}

function render() {
  if (!data) return;
  const q = $('#q').value.trim().toLowerCase();
  const ps = data.projects.map((p) => {
    if (!q) return p;
    const hitP = (p.name + ' ' + p.root).toLowerCase().includes(q);
    const threads = hitP ? p.threads : p.threads.filter((t) => (t.title + ' ' + t.id).toLowerCase().includes(q));
    return hitP || threads.length ? { ...p, threads } : null;
  }).filter(Boolean);

  const sum = (k) => data.projects.reduce((a, p) => a + p[k], 0);
  $('#kpis').innerHTML = [
    ['Running', sum('live')], ['Threads 7d', sum('recent7')], ['Open threads', sum('open')], ['Errors', sum('errors')],
  ].map(([l, v]) => `<div class="kpi"><b>${v}</b><small>${l}</small></div>`).join('');
  $('#meta').textContent = `Top ${data.projects.length} of ${data.projectCount} · updated ${new Date(data.generatedAt).toLocaleTimeString()}`;

  $('#grid').innerHTML = ps.length ? ps.map((p, i) => `
    <section class="card">
      <div class="top">
        <div class="rank">${i + 1}</div>
        <div class="grow">
          <div class="name">${esc(p.name)}</div>
          <div class="root" title="${esc(p.root)}">${esc(p.root || p.id)}</div>
        </div>
        ${p.errors ? `<span class="badge err">⚠ ${p.errors} error${p.errors > 1 ? 's' : ''}</span>` : ''}
        ${p.live ? `<span class="badge">● ${p.live} running</span>` : ''}
      </div>
      <div class="top" style="align-items:flex-end">
        <div class="stats grow">
          <span><b>${p.recent7}</b> thread${p.recent7 === 1 ? '' : 's'} 7d</span>
          <span><b>${p.open}</b> open</span>
          <span>last ${ago(p.last)}</span>
        </div>
        ${spark(p.spark)}
      </div>
      ${p.error ? `<div class="badge err">${esc(p.error)}</div>` : ''}
      ${p.threads.length ? `<ul class="threads">${p.threads.map(threadRow).join('')}</ul>` : '<div class="t-sub">No open threads</div>'}
    </section>`).join('') : '<div class="empty">No matching projects.</div>';
}

async function load(fresh) {
  $('#refresh').disabled = true;
  try {
    const r = await fetch('/api/board' + (fresh ? '?fresh=1' : ''));
    const j = await r.json();
    if (!r.ok) throw new Error(j.error || r.statusText);
    data = j; render();
  } catch (e) {
    $('#grid').innerHTML = `<div class="error">Couldn't read Cloudroom. Is the Cloudroom app running and <b>room-cli</b> on PATH?
      <code>${esc(e.message)}</code></div>`;
  } finally { $('#refresh').disabled = false; }
}

$('#q').addEventListener('input', render);
$('#refresh').addEventListener('click', () => load(true));
$('#theme').addEventListener('click', () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
  const next = cur === 'dark' ? 'light' : 'dark';
  document.documentElement.dataset.theme = next; localStorage.pboardTheme = next;
});
if (localStorage.pboardTheme) document.documentElement.dataset.theme = localStorage.pboardTheme;
document.addEventListener('keydown', (e) => { if (e.key === 'r' && e.target.tagName !== 'INPUT') load(true); });
document.addEventListener('click', (e) => {
  const b = e.target.closest('[data-copy]');
  if (b) { navigator.clipboard?.writeText(b.dataset.copy); b.textContent = '✓'; setTimeout(() => b.textContent = '⧉', 900); }
});
const tip = $('#tip');
document.addEventListener('mousemove', (e) => {
  const t = e.target.closest?.('[data-tip]');
  if (!t) { tip.style.display = 'none'; return; }
  tip.textContent = t.dataset.tip; tip.style.display = 'block';
  tip.style.left = e.clientX + 12 + 'px'; tip.style.top = e.clientY + 12 + 'px';
});
setInterval(() => { if (!document.hidden) load(false); }, 60000);
load(false);
</script>
</body>
</html>
